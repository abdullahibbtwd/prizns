# Isolated infrastructure for API integration/e2e tests.
# Start:  docker compose -f docker-compose.test.yml up -d --wait
#         + scripts/start-test-minio.sh  (OSS MinIO binary — Docker images are gone/license-gated)
# Stop:   docker compose -f docker-compose.test.yml down -v
#         + scripts/stop-test-minio.sh

name: prizn-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prizn_test
      POSTGRES_PASSWORD: prizn_test
      POSTGRES_DB: prizn_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prizn_test -d prizn_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
