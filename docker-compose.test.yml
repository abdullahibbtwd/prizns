# Isolated infrastructure for API integration/e2e tests.
# Start:  docker compose -f docker-compose.test.yml up -d --wait
# Stop:   docker compose -f docker-compose.test.yml down -v

name: prizn-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prizn_test
      POSTGRES_PASSWORD: prizn_test
      POSTGRES_DB: prizn_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prizn_test -d prizn_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_test
      MINIO_ROOT_PASSWORD: minio_test_secret
    ports:
      - "9014:9000"
      - "9015:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
