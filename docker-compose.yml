name: prizn

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PUBLISH_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${PUBLISH_BIND:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # Host publish (9010) — separate from MINIO_PORT used by the API client.
      # Avoids clashing with another MinIO already on host :9000 (Coolify/Hostinger).
      - "${PUBLISH_BIND:-0.0.0.0}:${MINIO_HOST_PORT:-9010}:9000"
      - "${PUBLISH_BIND:-0.0.0.0}:${MINIO_CONSOLE_HOST_PORT:-${MINIO_CONSOLE_PORT:-9011}}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override localhost hosts for in-compose networking
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      # Inside Docker network MinIO always listens on 9000 (container port).
      # Host publish is MINIO_HOST_PORT (9010) — do not set MINIO_PORT=9000 in Coolify
      # for the host mapping; that conflict is what this split fixes.
      MINIO_PORT: 9000
      # Browser-facing URL. Use `/media` (proxied by web nginx) on Coolify/Docker.
      # Local API outside Docker: http://localhost:9010
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/media}
      API_PORT: 3000
      # Auto seed admin + journal content on boot (safe upserts). Set false to skip.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    ports:
      - "${PUBLISH_BIND:-0.0.0.0}:${API_PORT:-3000}:3000"
    # Do NOT depend on one-shot init containers — Coolify removes them and
    # `service_completed_successfully` then fails with "No such container".
    # Bucket + public policy are ensured by StorageService.onModuleInit.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./prizn
      dockerfile: Dockerfile
      args:
        # Default `/api` so Coolify/docker builds don't bake localhost into JS.
        # Override with full URL only for special setups.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-Prizn}
    restart: unless-stopped
    ports:
      # Stage2 host nginx: set PUBLISH_BIND=127.0.0.1 so only host :80 is public.
      - "${PUBLISH_BIND:-0.0.0.0}:${WEB_PORT:-5173}:80"
    depends_on:
      - api
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
