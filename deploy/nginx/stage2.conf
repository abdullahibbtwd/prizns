# Host Nginx in front of Docker on stage2.prizni.bg
#
# This is NOT prizn/nginx.conf (that file stays inside the web container).
# Fail2ban should watch THIS host log: /var/log/nginx/access.log
#
# Install:
#   1. Install nginx on the host (distro package — this box is not Ubuntu).
#   2. Copy this file to /etc/nginx/conf.d/prizn.conf
#      (or /etc/nginx/sites-enabled/prizn if the host uses that layout).
#   3. Match proxy_pass port to WEB_PORT in the app .env (5175).
#   4. Set PUBLISH_BIND=127.0.0.1 in .env so Docker is not on the public NIC.
#   5. nginx -t && reload nginx (systemctl reload nginx, or nginx -s reload).
#   6. Enable the jail in deploy/fail2ban/.

# Must live in http {} — conf.d / sites-enabled includes are already there.
limit_req_zone $binary_remote_addr zone=prizn_login:10m rate=10r/m;

upstream prizn_web {
  server 127.0.0.1:5175;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name stage2.prizni.bg;

  access_log /var/log/nginx/access.log combined;
  error_log  /var/log/nginx/error.log warn;

  client_max_body_size 200m;

  # CMS password login — rate-limit + fail2ban on 401
  location = /api/auth/login {
    limit_req zone=prizn_login burst=8 nodelay;
    limit_req_status 429;

    proxy_pass http://prizn_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass http://prizn_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
