# Copy to /etc/fail2ban/jail.d/prizn-cms-login.conf then:
#   fail2ban-client reload
#
# Uses the host Nginx log, not Docker container logs.

[prizn-cms-login]
enabled  = true
filter   = prizn-cms-login
port     = http,https
logpath  = /var/log/nginx/access.log
backend  = polling
maxretry = 8
findtime = 10m
bantime  = 1h
action   = iptables-multiport[name=prizn-cms-login, port="http,https", protocol=tcp]
