map $http_user_agent $prizni_is_bot {
  default 0;
  ~*(googlebot|bingbot|yandex|baiduspider|twitterbot|facebookexternalhit|facebot|linkedinbot|slackbot|discordbot|whatsapp|telegrambot|applebot|duckduckbot|semrushbot|ahrefsbot) 1;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS — re-resolve api/minio after container recreates.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Host nginx (or Coolify) sits in front and sends X-Forwarded-For.
  # Docker bridge IPs are trusted so $remote_addr becomes the real client.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Same-origin API (Docker service name `api` listens on 3000 inside the network)
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 210m;
  }

  # Same-origin MinIO objects: /media/<bucket>/<key> → minio:9000/<bucket>/<key>
  location /media/ {
    set $minio_upstream http://minio:9000;
    rewrite ^/media/(.*)$ /$1 break;
    proxy_pass $minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    client_max_body_size 210m;
  }

  location = /sitemap.xml {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream/api/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /feed.xml {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream/api/feed.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /feed.json {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream/api/feed.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /robots.txt {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream/api/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WhatsApp / Twitter / Facebook fetch og:image with a bot UA.
  # Serve real files so they do not receive the crawler HTML shell.
  location ~* \.(?:ico|jpe?g|png|gif|svg|webp|woff2?|ttf|css|js|map)$ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location @spa {
    root /usr/share/nginx/html;
    try_files /index.html =500;
  }

  location @bot_shell {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream/api/bot-shell?path=$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @spa;
  }

  location / {
    error_page 418 = @bot_shell;
    if ($prizni_is_bot) {
      return 418;
    }
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
